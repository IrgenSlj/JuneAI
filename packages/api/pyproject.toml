[project]
name = "june-api"
version = "0.1.0"
description = "June's HTTP API: FastAPI with SSE streaming on top of june-brain"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13"
dependencies = [
    "june-brain",
    # Cap at <1 — FastAPI is still pre-1.0 and reserves the right to break
    # behaviour at the minor level. Stay on a known-good range.
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    # Imported directly (app.py, routes/chat.py) rather than only via FastAPI's
    # re-exports; declared so the dep graph is honest.
    # Security floor (B.5, 2026-08-20): 7 advisories against 1.0.0, including
    # PYSEC-2026-248/249. FastAPI pulls starlette in, but the floor is declared
    # here so a fresh bootstrap cannot resolve back to a vulnerable one.
    "starlette>=1.3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "mypy>=1.13.0",
    "ruff>=0.8.0",
]

[project.scripts]
june-api = "june_api.__main__:main"

[build-system]
requires = ["setuptools>=73.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
june-brain = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
