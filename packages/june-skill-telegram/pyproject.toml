[project]
name = "june-skill-telegram"
version = "0.1.0"
description = "June Telegram skill -- bridge between Telegram and JuneAI via long-polling."
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["june-brain"]

[project.optional-dependencies]
telegram = ["python-telegram-bot>=20.0,<22.0"]

[build-system]
requires = ["setuptools>=73.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
june-brain = { workspace = true }
