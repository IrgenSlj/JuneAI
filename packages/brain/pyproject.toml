[project]
name = "june-brain"
version = "0.1.0"
description = "June's intelligence: agent, memory, skills loader, and model providers"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13"
dependencies = [
    "python-dotenv>=1.0.1",
    # Single storage engine (ADR 0019): sqlite-vec is a small loadable C
    # extension that adds vector search to the stdlib sqlite3 already holding
    # facts/structure/graph. It replaced chromadb + sentence-transformers
    # (and their torch/transformers/onnxruntime tree); embeddings now come
    # from a local Ollama model.
    "sqlite-vec>=0.1.0",
    "keyring>=25.0.0",
    "tomli>=2.0.1; python_version < '3.11'",  # python 3.11+ has tomllib built-in
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "mypy>=1.13.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["setuptools>=73.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"june_brain.skills" = ["registry_index.json"]
"june_brain.memory" = ["extractor_prompt.txt"]
"june_brain.providers" = ["providers.toml"]
