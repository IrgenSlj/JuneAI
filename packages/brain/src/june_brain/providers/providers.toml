[roles]
local-fast = "gemma-fast"
# local-deep runs a thinking model (qwen3) so difficulty-routed hard/creative
# turns emit <think> reasoning that surfaces in the activity trace. Simple
# turns stay on the fast gemma model. Falls back to gemma-deep if qwen3 is
# not pulled.
local-deep = "qwen-deep"
cloud-capable = "gemini"

[providers.gemma-fast]
type = "gemma"
model = "gemma4:e2b"
base_url = "http://localhost:11434/v1"
tier = "local-fast"

[providers.qwen-deep]
type = "gemma"
model = "qwen3:8b"
base_url = "http://localhost:11434/v1"
tier = "local-deep"

[providers.gemma-deep]
type = "gemma"
model = "gemma4:e4b"
base_url = "http://localhost:11434/v1"
tier = "local-deep"

[providers.gemini]
type = "gemini"
model = "gemini-2.0-flash"
base_url = "https://generativelanguage.googleapis.com/v1beta/openai/"
tier = "cloud-capable"
