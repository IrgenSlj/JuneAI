services:
  juneai:
    build: .
    ports:
      - "8501:8501"
    volumes:
      # Memory persists across container restarts
      - june_memory:/data/memory
      # Mount .env so secrets stay outside the image
      - ./.env:/app/.env:ro
    environment:
      # Override the memory dir so it lands on the named volume
      - MEMORY_DIR=/data/memory
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  june_memory:
    driver: local
