[project]
name = "juneai"
version = "0.1.0"
description = "JuneAI - a local-first personal assistant with dual local/Claude runtimes, memory, and tool telemetry."
authors = []
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "streamlit>=1.40.0",
    "langchain>=0.3.0",
    "langgraph>=0.2.6",
    "langchain-anthropic>=0.3.0",
    "langchain-openai>=0.3.0",
    "python-dotenv>=1.0.1",
]


[project.optional-dependencies]
dev = [
    "anyio>=4.7.0",
    "codespell>=2.4.1",
    "langgraph-cli[inmem]>=0.2.8",
    "mypy>=1.13.0",
    "pytest>=8.3.5",
    "pytest-watch>=4.2.0",
    "ruff>=0.8.2",
]

[build-system]
requires = ["setuptools>=73.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["langgraph.templates.agent", "agent", "agent_ui"]
[tool.setuptools.package-dir]
"langgraph.templates.agent" = "src/agent"
"agent" = "src/agent"
"agent_ui" = "src/agent_ui"


[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.ruff]
lint.select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "T201",
    "UP",
]
lint.ignore = [
    "UP006",
    "UP007",
    # We actually do want to import from typing_extensions
    "UP035",
    # Relax the convention by _not_ requiring documentation for every function parameter.
    "D417",
    "E501",
]
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "UP"]
"scripts/*" = ["T201", "UP036"]

[tool.mypy]
python_version = "3.9"
strict = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = "agent.memory"
ignore_errors = true
