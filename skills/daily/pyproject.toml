[project]
name = "june-skill-daily"
version = "0.1.0"
description = "June daily skill — journaling, moods, goals, and open loops."
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["june-brain"]

[build-system]
requires = ["setuptools>=73.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
june-brain = { workspace = true }
