[project]
name = "june-skill-research"
version = "0.1.0"
description = "June research skill — web search via Brave Search (free tier) with a DuckDuckGo fallback."
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "june-brain",
    "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools>=73.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
june-brain = { workspace = true }
