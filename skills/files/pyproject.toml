[project]
name = "june-skill-files"
version = "0.1.0"
description = "June files skill — read local PDFs and extract clean text from webpages."
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "june-brain",
    "httpx>=0.27.0",
    "pypdf>=5.0.0",
    "trafilatura>=1.12.0",
]

[build-system]
requires = ["setuptools>=73.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
june-brain = { workspace = true }
