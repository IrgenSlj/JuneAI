<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" preserveAspectRatio="xMidYMid meet">
  <title>The guard layer and taint tracking</title>
  <desc>Every tool call the loop proposes passes through one seam, evaluate_call, which classifies it as read, read_network, write, write_network or execute. Execute and write_network are gated behind explicit approval. Tool results return framed as untrusted content and carry a taint marker; when tainted content flows into a new network call, that call is escalated to approval even if it would otherwise be allowed. Secrets are redacted before anything reaches the ledger. The defence is structural: there is no content-based injection detector.</desc>

  <rect width="1600" height="900" fill="#13110E"/>

  <g font-family="-apple-system, Helvetica Neue, Helvetica, Arial, sans-serif">
    <text x="80" y="72" font-size="15" font-weight="500" fill="#8E8778" letter-spacing="1.4">GUARD LAYER · ADR 0021</text>
    <text x="80" y="116" font-size="26" font-weight="500" fill="#F1EEE7">Untrusted content can be read. It cannot silently become an action.</text>

    <!-- proposal -->
    <g transform="translate(80, 190)">
      <rect width="248" height="70" rx="10" fill="#1A1814" stroke="rgba(255,250,240,0.16)"/>
      <text x="20" y="42" font-size="17" font-weight="500" fill="#F1EEE7">the loop proposes a call</text>
    </g>

    <g stroke="#8E8778" stroke-width="1.6" fill="#8E8778">
      <line x1="328" y1="225" x2="368" y2="225"/><path d="M374 225 l-9 -5 v10 z"/>
    </g>

    <!-- the single seam -->
    <g transform="translate(376, 168)">
      <rect width="108" height="424" rx="10" fill="rgba(242,172,110,0.16)" stroke="#F2AC6E" stroke-width="2.5"/>
      <text transform="translate(54, 212) rotate(-90)" text-anchor="middle" dominant-baseline="central"
            font-size="17" font-weight="600" fill="#F2AC6E"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace">evaluate_call</text>
    </g>
    <text x="430" y="620" text-anchor="middle" font-size="13" font-weight="400" fill="#8E8778">guard/actions.py</text>
    <text x="430" y="640" text-anchor="middle" font-size="13" font-weight="400" fill="#8E8778">one seam, no bypass</text>

    <!-- classification -->
    <text x="540" y="196" font-size="13" font-weight="500" fill="#8E8778" letter-spacing="1.2">ACTION CLASS</text>
    <g font-size="15" font-weight="500" transform="translate(540, 210)">
      <g transform="translate(0, 0)">
        <rect width="212" height="48" rx="8" fill="#1A1814" stroke="#8AA884" stroke-width="1.3"/>
        <text x="18" y="30" fill="#8AA884">read</text>
      </g>
      <g transform="translate(0, 60)">
        <rect width="212" height="48" rx="8" fill="#1A1814" stroke="#8AA884" stroke-width="1.3"/>
        <text x="18" y="30" fill="#8AA884">read_network</text>
      </g>
      <g transform="translate(0, 120)">
        <rect width="212" height="48" rx="8" fill="#1A1814" stroke="#C8A260" stroke-width="1.3"/>
        <text x="18" y="30" fill="#C8A260">write</text>
      </g>
      <g transform="translate(0, 180)">
        <rect width="212" height="48" rx="8" fill="#1A1814" stroke="#C8A260" stroke-width="1.3"/>
        <text x="18" y="30" fill="#C8A260">write_network</text>
      </g>
      <g transform="translate(0, 240)">
        <rect width="212" height="48" rx="8" fill="#1A1814" stroke="#C88080" stroke-width="1.3"/>
        <text x="18" y="30" fill="#C88080">execute</text>
      </g>
    </g>

    <!-- outcomes -->
    <text x="856" y="196" font-size="13" font-weight="500" fill="#8E8778" letter-spacing="1.2">OUTCOME</text>
    <g font-size="16" font-weight="500" transform="translate(856, 210)">
      <g transform="translate(0, 0)">
        <rect width="300" height="98" rx="10" fill="#1A1814" stroke="#8AA884" stroke-width="1.4"/>
        <text x="20" y="34" fill="#8AA884">runs</text>
        <text x="20" y="60" font-size="13" font-weight="400" fill="#8E8778">reading is not an action</text>
      </g>
      <g transform="translate(0, 120)">
        <rect width="300" height="98" rx="10" fill="#1A1814" stroke="#C8A260" stroke-width="1.6"/>
        <text x="20" y="34" fill="#C8A260">you are asked first</text>
        <text x="20" y="60" font-size="13" font-weight="400" fill="#8E8778">shown before it runs, and ledgered</text>
        <g stroke="#C8A260" stroke-width="1.6" fill="none">
          <circle cx="266" cy="30" r="7"/><line x1="266" y1="37" x2="266" y2="48"/><line x1="266" y1="44" x2="272" y2="44"/>
        </g>
      </g>
      <g transform="translate(0, 240)">
        <rect width="300" height="98" rx="10" fill="#1A1814" stroke="#C88080" stroke-width="1.4"/>
        <text x="20" y="34" fill="#C88080">refused</text>
        <text x="20" y="60" font-size="13" font-weight="400" fill="#8E8778">and the refusal is on the record</text>
      </g>
    </g>

    <g stroke="#8E8778" stroke-width="1.6" fill="#8E8778">
      <line x1="752" y1="234" x2="844" y2="240"/><path d="M850 240 l-9 -5 v10 z"/>
      <line x1="752" y1="294" x2="844" y2="252"/>
      <line x1="752" y1="354" x2="844" y2="366"/><path d="M850 366 l-9 -5 v10 z"/>
      <line x1="752" y1="414" x2="844" y2="372"/>
      <line x1="752" y1="474" x2="844" y2="486"/><path d="M850 486 l-9 -5 v10 z"/>
    </g>

    <!-- taint channel -->
    <g transform="translate(80, 660)">
      <rect width="1440" height="150" rx="12" fill="#1A1814" stroke="rgba(255,250,240,0.08)"/>
      <text x="24" y="34" font-size="13" font-weight="500" fill="#F2AC6E" letter-spacing="1.2">TAINT — WHY A READ CAN CHANGE WHAT A LATER CALL COSTS</text>

      <g font-size="15" font-weight="500" fill="#D8D3C9">
        <g transform="translate(24, 52)">
          <rect width="268" height="72" rx="9" fill="#22201B" stroke="rgba(255,250,240,0.08)"/>
          <text x="18" y="30" fill="#F1EEE7">a tool result</text>
          <text x="18" y="52" font-size="13" font-weight="400" fill="#8E8778">framed as untrusted content</text>
        </g>
        <g transform="translate(340, 52)">
          <rect width="268" height="72" rx="9" fill="#22201B" stroke="#C8A260" stroke-width="1.3"/>
          <text x="18" y="30" fill="#C8A260">carries a taint marker</text>
          <text x="18" y="52" font-size="13" font-weight="400" fill="#8E8778">it came from outside</text>
        </g>
        <g transform="translate(656, 52)">
          <rect width="300" height="72" rx="9" fill="#22201B" stroke="rgba(255,250,240,0.08)"/>
          <text x="18" y="30" fill="#F1EEE7">flows into a new call</text>
          <text x="18" y="52" font-size="13" font-weight="400" fill="#8E8778">e.g. a URL it suggested</text>
        </g>
        <g transform="translate(1004, 52)">
          <rect width="412" height="72" rx="9" fill="#22201B" stroke="#C8A260" stroke-width="1.6"/>
          <text x="18" y="30" fill="#C8A260">that call escalates to approval</text>
          <text x="18" y="52" font-size="13" font-weight="400" fill="#8E8778">even when its class would normally run</text>
        </g>
      </g>

      <g stroke="#C8A260" stroke-width="1.6" fill="#C8A260">
        <line x1="292" y1="88" x2="330" y2="88"/><path d="M336 88 l-9 -5 v10 z"/>
        <line x1="608" y1="88" x2="646" y2="88"/><path d="M652 88 l-9 -5 v10 z"/>
        <line x1="956" y1="88" x2="994" y2="88"/><path d="M1000 88 l-9 -5 v10 z"/>
      </g>
    </g>

    <!-- honest limitation, stated on the diagram itself -->
    <g transform="translate(1204, 190)">
      <rect width="316" height="132" rx="10" fill="none" stroke="#5F5A50" stroke-width="1.4" stroke-dasharray="5 5"/>
      <text x="20" y="34" font-size="13" font-weight="500" fill="#8E8778" letter-spacing="1.2">WHAT THIS IS NOT</text>
      <text x="20" y="62" font-size="14" font-weight="400" fill="#8E8778">The defence is structural.</text>
      <text x="20" y="86" font-size="14" font-weight="400" fill="#8E8778">There is no content-based</text>
      <text x="20" y="110" font-size="14" font-weight="400" fill="#8E8778">injection-phrase detector yet.</text>
    </g>

    <g transform="translate(1204, 350)">
      <rect width="316" height="108" rx="10" fill="#0E0C09" stroke="rgba(255,250,240,0.16)"/>
      <text x="20" y="34" font-size="15" font-weight="500" fill="#F2AC6E">secrets redacted</text>
      <text x="20" y="60" font-size="13" font-weight="400" fill="#8E8778">before anything is written to</text>
      <text x="20" y="82" font-size="13" font-weight="400" fill="#8E8778">the ledger or shown in a trace</text>
    </g>
  </g>
</svg>
