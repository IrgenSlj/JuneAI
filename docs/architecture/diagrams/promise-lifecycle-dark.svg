<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" role="img" preserveAspectRatio="xMidYMid meet">
  <title>Promise lifecycle</title>
  <desc>A promise is a standing intention, not a terminating TODO. It moves from pending to running, and from running to blocked, waiting on you, done or failed. Retries are capped at five and recurrence can return it to pending. On restart the API reconciles promises left running. Every blocked state must carry an explicit blocked reason, next action and final deliverable, so the UI never infers state from trace text. Resuming re-runs the goal; there is no mid-plan checkpoint yet.</desc>

  <rect width="1600" height="800" fill="#13110E"/>

  <g font-family="-apple-system, Helvetica Neue, Helvetica, Arial, sans-serif">
    <text x="80" y="72" font-size="15" font-weight="500" fill="#8E8778" letter-spacing="1.4">PROMISES</text>
    <text x="80" y="116" font-size="26" font-weight="500" fill="#F1EEE7">A standing intention, not a task that dies when it exits.</text>

    <g font-size="17" font-weight="500">
      <g transform="translate(96, 220)">
        <rect width="200" height="72" rx="10" fill="#1A1814" stroke="rgba(255,250,240,0.16)"/>
        <text x="20" y="42" fill="#F1EEE7">pending</text>
      </g>
      <g transform="translate(392, 220)">
        <rect width="200" height="72" rx="10" fill="#1A1814" stroke="#F2AC6E" stroke-width="1.8"/>
        <text x="20" y="42" fill="#F2AC6E">running</text>
      </g>

      <g transform="translate(720, 132)">
        <rect width="248" height="76" rx="10" fill="#1A1814" stroke="#C8A260" stroke-width="1.5"/>
        <text x="20" y="32" fill="#C8A260">blocked</text>
        <text x="20" y="56" font-size="13" font-weight="400" fill="#8E8778">something outside is missing</text>
      </g>
      <g transform="translate(720, 236)">
        <rect width="248" height="76" rx="10" fill="#1A1814" stroke="#C8A260" stroke-width="1.5"/>
        <text x="20" y="32" fill="#C8A260">waiting on you</text>
        <text x="20" y="56" font-size="13" font-weight="400" fill="#8E8778">an approval, or an answer</text>
      </g>
      <g transform="translate(720, 340)">
        <rect width="248" height="76" rx="10" fill="#1A1814" stroke="#8AA884" stroke-width="1.5"/>
        <text x="20" y="32" fill="#8AA884">done</text>
        <text x="20" y="56" font-size="13" font-weight="400" fill="#8E8778">with a final deliverable</text>
      </g>
      <g transform="translate(720, 444)">
        <rect width="248" height="76" rx="10" fill="#1A1814" stroke="#C88080" stroke-width="1.5"/>
        <text x="20" y="32" fill="#C88080">failed</text>
        <text x="20" y="56" font-size="13" font-weight="400" fill="#8E8778">after the retry cap</text>
      </g>
    </g>

    <!-- transitions -->
    <g stroke="#8E8778" stroke-width="1.6" fill="#8E8778">
      <line x1="296" y1="256" x2="374" y2="256"/><path d="M380 256 l-9 -5 v10 z"/>
      <line x1="592" y1="248" x2="656" y2="248"/>
      <line x1="656" y1="170" x2="656" y2="482"/>
      <line x1="656" y1="170" x2="708" y2="170"/><path d="M714 170 l-9 -5 v10 z"/>
      <line x1="656" y1="274" x2="708" y2="274"/><path d="M714 274 l-9 -5 v10 z"/>
      <line x1="656" y1="378" x2="708" y2="378"/><path d="M714 378 l-9 -5 v10 z"/>
      <line x1="656" y1="482" x2="708" y2="482"/><path d="M714 482 l-9 -5 v10 z"/>
    </g>

    <!-- retry + recurrence return paths -->
    <g stroke="#C8A260" stroke-width="1.6" fill="#C8A260" stroke-dasharray="6 5">
      <line x1="844" y1="132" x2="844" y2="122"/>
      <line x1="844" y1="122" x2="492" y2="122"/>
      <line x1="492" y1="122" x2="492" y2="214"/>
    </g>
    <path d="M492 220 l-5 -9 h10 z" fill="#C8A260"/>
    <text x="880" y="127" font-size="14" font-weight="500" fill="#C8A260">resume · retry (cap 5)</text>

    <g stroke="#8AA884" stroke-width="1.6" fill="#8AA884" stroke-dasharray="6 5">
      <line x1="968" y1="378" x2="1020" y2="378"/>
      <line x1="1020" y1="378" x2="1020" y2="588"/>
      <line x1="1020" y1="588" x2="196" y2="588"/>
      <line x1="196" y1="588" x2="196" y2="298"/>
    </g>
    <path d="M196 292 l-5 9 h10 z" fill="#8AA884"/>
    <text x="600" y="580" font-size="14" font-weight="500" fill="#8AA884">recurrence — a promise that repeats returns to pending</text>

    <!-- required fields on every blocked state -->
    <g transform="translate(1064, 132)">
      <rect width="456" height="284" rx="12" fill="#1A1814" stroke="#C8A260" stroke-width="1.5"/>
      <text x="24" y="38" font-size="13" font-weight="500" fill="#C8A260" letter-spacing="1.2">REQUIRED WHENEVER SHE IS NOT MOVING</text>
      <g font-size="15" font-weight="500" fill="#F1EEE7">
        <g transform="translate(24, 58)">
          <rect width="408" height="60" rx="9" fill="#22201B" stroke="rgba(255,250,240,0.08)"/>
          <text x="18" y="26" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#F2AC6E">blocked_reason</text>
          <text x="18" y="48" font-size="13" font-weight="400" fill="#8E8778">why it stopped, in plain words</text>
        </g>
        <g transform="translate(24, 130)">
          <rect width="408" height="60" rx="9" fill="#22201B" stroke="rgba(255,250,240,0.08)"/>
          <text x="18" y="26" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#F2AC6E">next_action</text>
          <text x="18" y="48" font-size="13" font-weight="400" fill="#8E8778">what would unblock it</text>
        </g>
        <g transform="translate(24, 202)">
          <rect width="408" height="60" rx="9" fill="#22201B" stroke="rgba(255,250,240,0.08)"/>
          <text x="18" y="26" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#F2AC6E">final_deliverable</text>
          <text x="18" y="48" font-size="13" font-weight="400" fill="#8E8778">what you get when it lands</text>
        </g>
      </g>
    </g>
    <text x="1064" y="444" font-size="14" font-weight="400" fill="#8E8778">The UI renders these fields. It never infers state by reading trace text.</text>

    <!-- restart reconciliation -->
    <g transform="translate(1064, 480)">
      <rect width="456" height="88" rx="10" fill="#22201B" stroke="rgba(255,250,240,0.16)"/>
      <text x="24" y="34" font-size="15" font-weight="500" fill="#F1EEE7">restart reconciliation</text>
      <text x="24" y="60" font-size="13" font-weight="400" fill="#8E8778">on boot the API finds promises left running and marks them,</text>
      <text x="24" y="78" font-size="13" font-weight="400" fill="#8E8778">so a crash never leaves one silently stalled</text>
    </g>

    <!-- honest limitation -->
    <g transform="translate(80, 640)">
      <rect width="1440" height="80" rx="10" fill="none" stroke="#5F5A50" stroke-width="1.4" stroke-dasharray="5 5"/>
      <text x="24" y="34" font-size="13" font-weight="500" fill="#8E8778" letter-spacing="1.2">KNOWN LIMITATION</text>
      <text x="24" y="60" font-size="15" font-weight="400" fill="#D8D3C9">Resuming re-runs the goal from the start. There is no mid-plan checkpoint yet, so work already done inside a run is repeated.</text>
    </g>
  </g>
</svg>
