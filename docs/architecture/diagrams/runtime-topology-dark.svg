<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" preserveAspectRatio="xMidYMid meet">
  <title>Runtime topology and distribution</title>
  <desc>June.app is a Tauri shell that supervises a PyInstaller-frozen Python sidecar staged under Contents/Resources, serving a SvelteKit build. Every connection is loopback: the webview talks to the sidecar on 127.0.0.1 port 8000 with a shared token, and the sidecar talks to a separately installed Ollama on 127.0.0.1 port 11434. All state lives in one versioned data directory. Models are not bundled in the DMG.</desc>

  <rect width="1600" height="900" fill="#13110E"/>

  <g font-family="-apple-system, Helvetica Neue, Helvetica, Arial, sans-serif">
    <text x="80" y="72" font-size="15" font-weight="500" fill="#8E8778" letter-spacing="1.4">RUNTIME TOPOLOGY</text>
    <text x="80" y="116" font-size="26" font-weight="500" fill="#F1EEE7">One app, one loopback port, one data directory.</text>

    <!-- the bundle -->
    <g transform="translate(80, 176)">
      <rect width="700" height="404" rx="14" fill="#1A1814" stroke="rgba(255,250,240,0.16)"/>
      <text x="24" y="38" font-size="15" font-weight="500" fill="#F1EEE7">June.app</text>
      <text x="128" y="38" font-size="13" font-weight="400" fill="#8E8778">~45 MB DMG · Apple Silicon · ad-hoc signed</text>

      <g transform="translate(24, 60)">
        <rect width="652" height="88" rx="10" fill="#22201B" stroke="rgba(255,250,240,0.08)"/>
        <text x="20" y="34" font-size="16" font-weight="500" fill="#F1EEE7">Tauri shell (Rust)</text>
        <text x="20" y="60" font-size="13" font-weight="400" fill="#8E8778">spawns and supervises the sidecar · watchdog · corrupt-DB recovery</text>
      </g>

      <g transform="translate(24, 168)">
        <rect width="316" height="104" rx="10" fill="#22201B" stroke="rgba(255,250,240,0.08)"/>
        <text x="20" y="32" font-size="16" font-weight="500" fill="#F1EEE7">webview</text>
        <text x="20" y="56" font-size="13" font-weight="400" fill="#8E8778">the SvelteKit build —</text>
        <text x="20" y="76" font-size="13" font-weight="400" fill="#8E8778">the same one the PWA uses</text>
      </g>

      <g transform="translate(360, 168)">
        <rect width="316" height="104" rx="10" fill="#22201B" stroke="#F2AC6E" stroke-width="1.6"/>
        <text x="20" y="32" font-size="16" font-weight="500" fill="#F2AC6E">june-api sidecar</text>
        <text x="20" y="56" font-size="13" font-weight="400" fill="#8E8778">PyInstaller onedir, staged at</text>
        <text x="20" y="76" font-size="12" font-weight="400" fill="#8E8778" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Contents/Resources/june-api/</text>
      </g>

      <g transform="translate(24, 292)">
        <rect width="652" height="88" rx="10" fill="#22201B" stroke="rgba(255,250,240,0.08)"/>
        <text x="20" y="34" font-size="15" font-weight="500" fill="#F1EEE7">skills as child processes</text>
        <text x="20" y="60" font-size="13" font-weight="400" fill="#8E8778">launched by the sidecar, inside the frozen bundle, one per enabled skill</text>
      </g>

      <!-- loopback between webview and sidecar -->
      <g stroke="#8AA884" stroke-width="1.6" fill="#8AA884">
        <line x1="340" y1="212" x2="352" y2="212"/><path d="M358 212 l-9 -5 v10 z"/>
      </g>
    </g>
    <text x="500" y="404" text-anchor="middle" font-size="12" font-weight="500" fill="#8AA884" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">127.0.0.1:8000</text>
    <text x="500" y="422" text-anchor="middle" font-size="12" font-weight="400" fill="#8E8778">+ shared loopback token</text>

    <!-- ollama, installed separately -->
    <g transform="translate(880, 260)">
      <rect width="420" height="236" rx="14" fill="#1A1814" stroke="#8AA884" stroke-width="1.6"/>
      <text x="24" y="38" font-size="13" font-weight="500" fill="#8AA884" letter-spacing="1.2">OLLAMA — INSTALLED SEPARATELY</text>
      <text x="24" y="70" font-size="15" font-weight="400" fill="#8E8778">not bundled in the DMG; June detects it</text>
      <text x="24" y="92" font-size="15" font-weight="400" fill="#8E8778">and walks you through installing it</text>
      <g font-size="14" font-weight="500" fill="#D8D3C9">
        <g transform="translate(24, 112)"><rect width="372" height="34" rx="7" fill="#22201B" stroke="rgba(255,250,240,0.08)"/><text x="16" y="22">gemma4:e2b · ~7.2 GB</text></g>
        <g transform="translate(24, 154)"><rect width="372" height="34" rx="7" fill="#22201B" stroke="rgba(255,250,240,0.08)"/><text x="16" y="22">gemma4:e4b · deeper reasoning</text></g>
        <g transform="translate(24, 196)"><rect width="372" height="34" rx="7" fill="#22201B" stroke="rgba(255,250,240,0.08)"/><text x="16" y="22">nomic-embed-text · ~275 MB</text></g>
      </g>
    </g>

    <g stroke="#8AA884" stroke-width="1.6" fill="#8AA884">
      <line x1="780" y1="380" x2="868" y2="380"/><path d="M874 380 l-9 -5 v10 z"/>
    </g>
    <text x="824" y="368" text-anchor="middle" font-size="12" font-weight="500" fill="#8AA884" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">127.0.0.1:11434</text>

    <!-- data directory -->
    <g transform="translate(80, 620)">
      <rect width="700" height="180" rx="14" fill="#1A1814" stroke="rgba(255,250,240,0.16)"/>
      <text x="24" y="38" font-size="13" font-weight="500" fill="#8E8778" letter-spacing="1.2">ONE VERSIONED DATA DIRECTORY</text>
      <text x="24" y="66" font-size="15" font-weight="400" fill="#8E8778">copy the folder to move machines — that is the whole migration story</text>
      <g font-size="14" font-weight="500" fill="#D8D3C9">
        <g transform="translate(24, 86)"><rect width="200" height="34" rx="7" fill="#22201B" stroke="rgba(255,250,240,0.08)"/><text x="16" y="22">memory/june.db</text></g>
        <g transform="translate(240, 86)"><rect width="200" height="34" rx="7" fill="#22201B" stroke="rgba(255,250,240,0.08)"/><text x="16" y="22">character/</text></g>
        <g transform="translate(456, 86)"><rect width="220" height="34" rx="7" fill="#22201B" stroke="rgba(255,250,240,0.08)"/><text x="16" y="22">config/ · traces/ · tasks/</text></g>
      </g>
      <text x="24" y="160" font-size="13" font-weight="400" fill="#8E8778">manifest.json records the schema version, so an older build refuses a newer directory rather than corrupting it</text>
    </g>

    <g stroke="#8E8778" stroke-width="1.6" fill="#8E8778">
      <line x1="430" y1="580" x2="430" y2="612"/><path d="M430 618 l-5 -9 h10 z"/>
    </g>

    <!-- alternate shell -->
    <g transform="translate(880, 620)">
      <rect width="420" height="180" rx="14" fill="none" stroke="#5F5A50" stroke-width="1.4" stroke-dasharray="5 5"/>
      <text x="24" y="38" font-size="13" font-weight="500" fill="#8E8778" letter-spacing="1.2">OR JUST A BROWSER</text>
      <text x="24" y="70" font-size="15" font-weight="400" fill="#D8D3C9">Run the API yourself and open the PWA.</text>
      <text x="24" y="96" font-size="15" font-weight="400" fill="#D8D3C9">Same build, same brain, same memory —</text>
      <text x="24" y="122" font-size="15" font-weight="400" fill="#D8D3C9">the desktop app is a shell around it.</text>
      <text x="24" y="156" font-size="13" font-weight="400" fill="#8E8778">No shell-specific business logic exists.</text>
    </g>

    <text x="80" y="864" font-size="15" font-weight="400" fill="#8E8778">Every arrow on this diagram is 127.0.0.1. Nothing here listens on an external interface, and nothing here phones home.</text>
  </g>
</svg>
