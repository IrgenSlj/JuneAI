<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" role="img" preserveAspectRatio="xMidYMid meet">
  <title>The visible cloud boundary</title>
  <desc>Every cloud-routed model call, whether it comes from the loop or from a skill, passes through one function: record_cloud_call in providers/provenance.py. It writes an egress entry to the hash-chained Trust Ledger and renders a provenance line in the UI, before and after the call. In local-only mode the same function raises CloudEgressBlockedError at the start phase, so the request never leaves the machine. There is no second path.</desc>

  <rect width="1600" height="700" fill="#FAF9F7"/>

  <g font-family="-apple-system, Helvetica Neue, Helvetica, Arial, sans-serif">
    <text x="80" y="72" font-size="15" font-weight="500" fill="#6B665D" letter-spacing="1.4">ONE DOOR, AND IT IS ALWAYS ON THE RECORD</text>
    <text x="80" y="116" font-size="26" font-weight="500" fill="#141410">A skill cannot egress and skip the ledger. There is no second path.</text>

    <!-- device boundary -->
    <rect x="56" y="160" width="1000" height="470" rx="18"
          fill="none" stroke="#141410" stroke-width="2.5" stroke-opacity="0.55"/>
    <text x="80" y="196" font-size="14" font-weight="500" fill="#6B665D" letter-spacing="1.4">YOUR MACHINE</text>

    <!-- callers -->
    <g font-size="17" font-weight="500" fill="#141410">
      <g transform="translate(96, 232)">
        <rect width="240" height="64" rx="10" fill="#FFFFFF" stroke="rgba(20,16,10,0.14)"/>
        <text x="20" y="38">the loop</text>
      </g>
      <g transform="translate(96, 320)">
        <rect width="240" height="64" rx="10" fill="#FFFFFF" stroke="rgba(20,16,10,0.14)"/>
        <text x="20" y="38">a skill</text>
      </g>
      <g transform="translate(96, 408)">
        <rect width="240" height="64" rx="10" fill="#FFFFFF" stroke="rgba(20,16,10,0.14)"/>
        <text x="20" y="38">a promise</text>
      </g>
    </g>

    <!-- every caller funnels into the same bar -->
    <g stroke="#6B665D" stroke-width="1.6" fill="#6B665D">
      <line x1="336" y1="264" x2="392" y2="264"/><line x1="392" y1="264" x2="392" y2="352"/>
      <line x1="336" y1="352" x2="392" y2="352"/>
      <line x1="336" y1="440" x2="392" y2="440"/><line x1="392" y1="440" x2="392" y2="352"/>
      <line x1="392" y1="352" x2="440" y2="352"/><path d="M446 352 l-9 -5 v10 z"/>
    </g>

    <!-- the chokepoint: a narrow bar, not a box with a way around it -->
    <g transform="translate(448, 208)">
      <rect width="112" height="288" rx="10" fill="rgba(232,150,90,0.12)" stroke="#E8965A" stroke-width="2.5"/>
      <text transform="translate(56, 144) rotate(-90)" text-anchor="middle" dominant-baseline="central" font-size="17" font-weight="600" fill="#E8965A" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">record_cloud_call</text>
    </g>
    <text x="504" y="528" text-anchor="middle" font-size="13" font-weight="400" fill="#6B665D">providers/</text>
    <text x="504" y="548" text-anchor="middle" font-size="13" font-weight="400" fill="#6B665D">provenance.py</text>

    <!-- what the chokepoint emits, on every single call -->
    <g font-size="15" font-weight="500">
      <g transform="translate(616, 216)">
        <rect width="392" height="72" rx="10" fill="#F0ECE3" stroke="rgba(20,16,10,0.14)"/>
        <text x="20" y="30" fill="#E8965A">egress entry → Trust Ledger</text>
        <text x="20" y="54" font-size="13" font-weight="400" fill="#6B665D">append-only · blake2b hash-chained · verifiable</text>
        <g stroke="#6B665D" stroke-width="1.5" fill="none">
          <rect x="344" y="24" width="16" height="12" rx="6"/>
          <rect x="353" y="24" width="16" height="12" rx="6"/>
        </g>
      </g>
      <g transform="translate(616, 312)">
        <rect width="392" height="72" rx="10" fill="#FFFFFF" stroke="rgba(20,16,10,0.14)"/>
        <text x="20" y="30" fill="#141410">provenance line in the UI</text>
        <text x="20" y="54" font-size="13" font-weight="400" fill="#6B665D">which model ran, what left, and why — before and after</text>
      </g>
      <g transform="translate(616, 408)">
        <rect width="392" height="72" rx="10" fill="#FFFFFF" stroke="rgba(20,16,10,0.14)"/>
        <text x="20" y="30" fill="#141410">the call itself</text>
        <text x="20" y="54" font-size="13" font-weight="400" fill="#6B665D">only on an explicit agentic path, never by auto-escalation</text>
      </g>
    </g>

    <g stroke="#6B665D" stroke-width="1.6" fill="#6B665D">
      <line x1="560" y1="252" x2="604" y2="252"/><path d="M610 252 l-9 -5 v10 z"/>
      <line x1="560" y1="348" x2="604" y2="348"/><path d="M610 348 l-9 -5 v10 z"/>
      <line x1="560" y1="444" x2="604" y2="444"/><path d="M610 444 l-9 -5 v10 z"/>
    </g>

    <!-- the single crossing -->
    <line x1="1008" y1="444" x2="1240" y2="444" stroke="#8A6A2F" stroke-width="2.2" stroke-dasharray="8 7"/>
    <path d="M1240 444 l-11 -6 v12 z" fill="#8A6A2F"/>

    <!-- local-only: the same function raises before anything leaves -->
    <g transform="translate(1056, 444)">
      <circle r="15" fill="#FAF9F7" stroke="#8A3B3B" stroke-width="2.4"/>
      <line x1="-7.5" y1="0" x2="7.5" y2="0" stroke="#8A3B3B" stroke-width="2.4" stroke-linecap="round"/>
    </g>
    <text x="1032" y="502" text-anchor="end" font-size="14" font-weight="500" fill="#8A3B3B">local-only mode</text>
    <text x="1032" y="524" text-anchor="end" font-size="13" font-weight="400" fill="#8A3B3B">raises CloudEgressBlockedError</text>
    <text x="1032" y="546" text-anchor="end" font-size="13" font-weight="400" fill="#6B665D">at the start phase — before the request leaves</text>

    <!-- cloud, outside -->
    <g transform="translate(1264, 400)">
      <rect width="256" height="88" rx="12" fill="none" stroke="#9A948A" stroke-width="1.5" stroke-dasharray="6 6"/>
      <text x="20" y="34" font-size="13" font-weight="500" fill="#6B665D" letter-spacing="1.2">CLOUD</text>
      <text x="20" y="64" font-size="18" font-weight="500" fill="#2A2824">gemini-2.0-flash</text>
    </g>

    <text x="80" y="676" font-size="15" font-weight="400" fill="#6B665D">The dashed edge is the only one that crosses. It is opt-in, it is recorded whether it succeeds or fails, and the privacy dial closes it.</text>
  </g>
</svg>
