<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" preserveAspectRatio="xMidYMid meet">
  <title>The life of a turn</title>
  <desc>Every message follows the same fixed path: recall runs four-signal fusion, context is assembled with anchored compaction, difficulty routing picks a local tier without ever escalating to cloud on its own, the provider streams tokens, each tool call passes the guard which may allow, gate on approval, or refuse, results return framed as untrusted content and loop back to the model, then memory is written, a provenance line is rendered, and the turn is appended to the ledger.</desc>

  <rect width="1600" height="900" fill="#13110E"/>

  <g font-family="-apple-system, Helvetica Neue, Helvetica, Arial, sans-serif">
    <text x="80" y="72" font-size="15" font-weight="500" fill="#8E8778" letter-spacing="1.4">THE LIFE OF A TURN</text>
    <text x="80" y="116" font-size="26" font-weight="500" fill="#F1EEE7">One fixed path. The loop chooses what to do, never what shape to be.</text>
    <text x="80" y="150" font-size="15" font-weight="400" fill="#5F5A50">Nothing on this diagram leaves your machine unless stage 5 routes to cloud, which needs an explicit agentic path.</text>

    <g font-size="16" font-weight="500">
      <!-- row 1 -->
      <g transform="translate(80, 200)">
        <rect width="212" height="80" rx="10" fill="#1A1814" stroke="rgba(255,250,240,0.16)"/>
        <text x="18" y="30" font-size="12" fill="#F2AC6E">1</text>
        <text x="18" y="52" fill="#F1EEE7">message arrives</text>
        <text x="18" y="70" font-size="12" font-weight="400" fill="#8E8778">SSE stream opens</text>
      </g>
      <g transform="translate(336, 200)">
        <rect width="212" height="80" rx="10" fill="#1A1814" stroke="rgba(255,250,240,0.16)"/>
        <text x="18" y="30" font-size="12" fill="#F2AC6E">2</text>
        <text x="18" y="52" fill="#F1EEE7">recall</text>
        <text x="18" y="70" font-size="12" font-weight="400" fill="#8E8778">four-signal fusion</text>
      </g>
      <g transform="translate(592, 200)">
        <rect width="212" height="80" rx="10" fill="#1A1814" stroke="rgba(255,250,240,0.16)"/>
        <text x="18" y="30" font-size="12" fill="#F2AC6E">3</text>
        <text x="18" y="52" fill="#F1EEE7">context assembly</text>
        <text x="18" y="70" font-size="12" font-weight="400" fill="#8E8778">anchored compaction</text>
      </g>
      <g transform="translate(848, 200)">
        <rect width="212" height="80" rx="10" fill="#1A1814" stroke="rgba(255,250,240,0.16)"/>
        <text x="18" y="30" font-size="12" fill="#F2AC6E">4</text>
        <text x="18" y="52" fill="#F1EEE7">difficulty routing</text>
        <text x="18" y="70" font-size="12" font-weight="400" fill="#C8A260">never auto-escalates</text>
      </g>
      <g transform="translate(1104, 200)">
        <rect width="212" height="80" rx="10" fill="#1A1814" stroke="#8AA884" stroke-width="1.4"/>
        <text x="18" y="30" font-size="12" fill="#F2AC6E">5</text>
        <text x="18" y="52" fill="#F1EEE7">provider streams</text>
        <text x="18" y="70" font-size="12" font-weight="400" fill="#8AA884">local tier by default</text>
      </g>

      <!-- row 2 -->
      <g transform="translate(1104, 360)">
        <rect width="212" height="80" rx="10" fill="rgba(242,172,110,0.16)" stroke="#F2AC6E" stroke-width="2"/>
        <text x="18" y="30" font-size="12" fill="#F2AC6E">6</text>
        <text x="18" y="52" fill="#F2AC6E">guard.evaluate_call</text>
        <text x="18" y="70" font-size="12" font-weight="400" fill="#D8D3C9">one seam, every tool</text>
      </g>
      <g transform="translate(848, 360)">
        <rect width="212" height="80" rx="10" fill="#1A1814" stroke="rgba(255,250,240,0.16)"/>
        <text x="18" y="30" font-size="12" fill="#F2AC6E">7</text>
        <text x="18" y="52" fill="#F1EEE7">result framed</text>
        <text x="18" y="70" font-size="12" font-weight="400" fill="#8E8778">as untrusted content</text>
      </g>
      <g transform="translate(592, 360)">
        <rect width="212" height="80" rx="10" fill="#1A1814" stroke="rgba(255,250,240,0.16)"/>
        <text x="18" y="30" font-size="12" fill="#F2AC6E">8</text>
        <text x="18" y="52" fill="#F1EEE7">memory write</text>
        <text x="18" y="70" font-size="12" font-weight="400" fill="#8E8778">+ salience update</text>
      </g>
      <g transform="translate(336, 360)">
        <rect width="212" height="80" rx="10" fill="#1A1814" stroke="rgba(255,250,240,0.16)"/>
        <text x="18" y="30" font-size="12" fill="#F2AC6E">9</text>
        <text x="18" y="52" fill="#F1EEE7">provenance frame</text>
        <text x="18" y="70" font-size="12" font-weight="400" fill="#8E8778">what ran, what left</text>
      </g>
      <g transform="translate(80, 360)">
        <rect width="212" height="80" rx="10" fill="#0E0C09" stroke="rgba(255,250,240,0.16)"/>
        <text x="18" y="30" font-size="12" fill="#F2AC6E">10</text>
        <text x="18" y="52" fill="#F1EEE7">ledger append</text>
        <text x="18" y="70" font-size="12" font-weight="400" fill="#8E8778">append-only</text>
        <g stroke="#8E8778" stroke-width="1.5" fill="none">
          <rect x="168" y="18" width="14" height="10" rx="5"/>
          <rect x="176" y="18" width="14" height="10" rx="5"/>
        </g>
      </g>
    </g>

    <!-- flow -->
    <g stroke="#8E8778" stroke-width="1.6" fill="#8E8778">
      <line x1="292" y1="240" x2="324" y2="240"/><path d="M330 240 l-9 -5 v10 z"/>
      <line x1="548" y1="240" x2="580" y2="240"/><path d="M586 240 l-9 -5 v10 z"/>
      <line x1="804" y1="240" x2="836" y2="240"/><path d="M842 240 l-9 -5 v10 z"/>
      <line x1="1060" y1="240" x2="1092" y2="240"/><path d="M1098 240 l-9 -5 v10 z"/>
      <line x1="1210" y1="280" x2="1210" y2="352"/><path d="M1210 358 l-5 -9 h10 z"/>
      <line x1="1104" y1="400" x2="1072" y2="400"/><path d="M1066 400 l9 -5 v10 z"/>
      <line x1="848" y1="400" x2="816" y2="400"/><path d="M810 400 l9 -5 v10 z"/>
      <line x1="592" y1="400" x2="560" y2="400"/><path d="M554 400 l9 -5 v10 z"/>
      <line x1="336" y1="400" x2="304" y2="400"/><path d="M298 400 l9 -5 v10 z"/>
    </g>

    <!-- the tool loop-back, drawn explicitly: 7 feeds the model again -->
    <g stroke="#F2AC6E" stroke-width="1.6" fill="#F2AC6E" stroke-dasharray="6 5">
      <line x1="954" y1="360" x2="954" y2="320"/>
      <line x1="954" y1="320" x2="1210" y2="320"/>
    </g>
    <path d="M1210 314 l-5 -9 h10 z" fill="#F2AC6E" transform="translate(0,-1)"/>
    <text x="960" y="308" font-size="13" font-weight="500" fill="#F2AC6E">tool results re-enter the model — the loop iterates until no tool is called</text>

    <!-- guard outcomes -->
    <g transform="translate(1104, 500)" font-size="14" font-weight="500">
      <text x="0" y="0" font-size="13" fill="#8E8778" letter-spacing="1.2">STAGE 6 OUTCOMES</text>
      <g transform="translate(0, 16)">
        <rect width="212" height="42" rx="8" fill="#1A1814" stroke="#8AA884" stroke-width="1.3"/>
        <text x="16" y="27" fill="#8AA884">allowed</text>
      </g>
      <g transform="translate(0, 68)">
        <rect width="212" height="42" rx="8" fill="#1A1814" stroke="#C8A260" stroke-width="1.3"/>
        <text x="16" y="27" fill="#C8A260">approval required</text>
        <g stroke="#C8A260" stroke-width="1.5" fill="none">
          <circle cx="186" cy="21" r="5"/><line x1="186" y1="26" x2="186" y2="33"/>
        </g>
      </g>
      <g transform="translate(0, 120)">
        <rect width="212" height="42" rx="8" fill="#1A1814" stroke="#C88080" stroke-width="1.3"/>
        <text x="16" y="27" fill="#C88080">refused</text>
      </g>
    </g>

    <!-- what the user sees -->
    <g transform="translate(80, 600)">
      <text x="0" y="0" font-size="13" font-weight="500" fill="#8E8778" letter-spacing="1.2">WHAT YOU SEE, WHILE IT HAPPENS</text>
      <rect x="0" y="20" width="936" height="150" rx="12" fill="#1A1814" stroke="rgba(255,250,240,0.08)"/>
      <g font-size="15" font-weight="500" fill="#D8D3C9">
        <g transform="translate(24, 44)">
          <rect width="272" height="102" rx="9" fill="#22201B" stroke="rgba(255,250,240,0.08)"/>
          <text x="18" y="30" fill="#F1EEE7">streaming text</text>
          <text x="18" y="54" font-size="13" font-weight="400" fill="#8E8778">from stage 5, token by token</text>
        </g>
        <g transform="translate(320, 44)">
          <rect width="272" height="102" rx="9" fill="#22201B" stroke="rgba(255,250,240,0.08)"/>
          <text x="18" y="30" fill="#F1EEE7">the approval prompt</text>
          <text x="18" y="54" font-size="13" font-weight="400" fill="#8E8778">from stage 6, before it runs</text>
        </g>
        <g transform="translate(616, 44)">
          <rect width="296" height="102" rx="9" fill="#22201B" stroke="rgba(255,250,240,0.08)"/>
          <text x="18" y="30" fill="#F1EEE7">the provenance line</text>
          <text x="18" y="54" font-size="13" font-weight="400" fill="#8E8778">from stage 9, under the reply</text>
        </g>
      </g>
    </g>

    <text x="80" y="840" font-size="15" font-weight="400" fill="#8E8778">The shape is fixed and never self-modified. What varies is the tier, the tools, and how many iterations stage 6 takes.</text>
  </g>
</svg>
