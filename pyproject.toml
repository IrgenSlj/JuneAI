[project]
name = "june-workspace"
version = "0.1.0"
description = "June monorepo workspace root"
requires-python = ">=3.13"

[tool.uv.workspace]
members = [
    "packages/brain",
    "packages/api",
    "skills/*",
]

[tool.ruff]
line-length = 100
lint.select = ["E", "F", "I", "UP", "T201"]
# UP006/UP007/UP035/UP045 defer typing-module -> builtin/PEP-604 rewrites
# until a focused repo-wide modernization pass. The runtime baseline is Python
# 3.13, but style churn should not be mixed into feature PRs.
lint.ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = ["D", "UP"]
"**/scripts/*" = ["T201"]
# tools/ holds operator-facing CLI scripts (seed_demo, retrieval_bench,
# svg_light_variant) where print is the intended UI, not stray debug output.
"tools/*" = ["T201"]
# Same reasoning, but this one ships inside the package because it is a console
# -script entry point (`june-mcp`): its stdout is the user interface for
# granting and revoking MCP access.
"**/mcp/cli.py" = ["T201"]

[tool.mypy]
python_version = "3.13"
strict = true
