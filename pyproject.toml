[project]
name = "june-workspace"
version = "0.0.0"
description = "June monorepo workspace root"
requires-python = ">=3.13"

[tool.uv.workspace]
members = [
    "packages/brain",
    "packages/api",
    "skills/*",
]

[tool.ruff]
line-length = 100
lint.select = ["E", "F", "I", "UP", "T201"]
# UP006/UP007/UP035/UP045 defer the typing-module → builtin/PEP-604 rewrites
# (Dict→dict, Optional[X]→X | None, etc.). The codebase targets 3.10 and uses
# explicit Optional/typing forms deliberately; modernizing them is a separate,
# repo-wide pass, not a per-PR lint failure.
lint.ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = ["D", "UP"]
"**/scripts/*" = ["T201"]

[tool.mypy]
python_version = "3.13"
strict = true
