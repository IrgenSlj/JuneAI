name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build

  backend:
    name: Backend
    runs-on: ubuntu-latest
    env:
      JUNE_DATA_DIR: ${{ runner.temp }}/june-data
      JUNE_SKIP_MODEL_CHECK: "1"
      JUNE_SKILLS_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: |
          python -m pip install -e "packages/brain[dev]" -e "packages/api[dev]"
          python -m pip install \
            -e "skills/calendar" \
            -e "skills/daily" \
            -e "skills/files" \
            -e "skills/health" \
            -e "skills/research"
      - run: python -m pytest packages/brain/tests packages/api/tests
      - run: ./tools/codegen.sh
      - run: git diff --exit-code packages/api/openapi.json packages/ui/src/api/types.ts
