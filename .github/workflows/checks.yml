name: Checks

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build

  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.13 is the supported floor (requires-python, mypy target); 3.14 is
        # what the maintainer develops on. Test both so the dev runtime is
        # covered, not just assumed.
        python-version: ["3.13", "3.14"]
    env:
      JUNE_DATA_DIR: /tmp/june-data
      JUNE_SKIP_MODEL_CHECK: "1"
      JUNE_SKILLS_DISABLED: "1"
      JUNE_SKIP_PNPM_INSTALL: "1"
      JUNE_CHECK_FRONTEND: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: ./tools/bootstrap.sh
      - run: ./tools/check.sh
