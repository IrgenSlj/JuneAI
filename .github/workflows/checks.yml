name: Checks

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build

  backend:
    name: Backend (Python 3.13)
    runs-on: ubuntu-latest
    env:
      JUNE_DATA_DIR: /tmp/june-data
      JUNE_SKIP_MODEL_CHECK: "1"
      JUNE_SKILLS_DISABLED: "1"
      JUNE_SKIP_PNPM_INSTALL: "1"
      JUNE_CHECK_FRONTEND: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: ./tools/bootstrap.sh
      - run: ./tools/check.sh
